<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Booking Form</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div class="container mt-2">
      <div class="title">
        <p class="fs-3 fw-bolder text-center">Travel Booking Form</p>
      </div>

      <form action="form.php" method="POST">
        <div id="form_post">
          <div class="accordion" id="travelBookingAccordion">
            <!-- Basic Information -->
            <div class="accordion-item">
              <h2 class="accordion-header" id="headingBasicInfo">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBasicInfo" aria-expanded="true" aria-controls="collapseBasicInfo">
                  Basic Information
                </button>
              </h2>
              <div id="collapseBasicInfo" class="accordion-collapse collapse show" aria-labelledby="headingBasicInfo" data-bs-parent="#travelBookingAccordion">
                <div class="accordion-body">
                  <div>
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required class="form-control">
                  </div>
                  <div>
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" required class="form-control">
                  </div>
                  <div>
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required class="form-control">
                  </div>
                  <div>
                    <label for="dob" class="form-label">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required class="form-control">
                  </div>
                </div>
              </div>
            </div>
    
            <!-- Travel Details -->
            <div class="accordion-item">
              <h2 class="accordion-header" id="headingTravelDetails">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTravelDetails" aria-expanded="false" aria-controls="collapseTravelDetails">
                  Travel Details
                </button>
              </h2>
              <div id="collapseTravelDetails" class="accordion-collapse collapse" aria-labelledby="headingTravelDetails" data-bs-parent="#travelBookingAccordion">
                <div class="accordion-body">
                  <div>
                    <label for="destination" class="form-label">Travel Destination</label>
                    <input type="text" id="destination" name="destination" required class="form-control">
                  </div>
                  <div>
                    <label for="departureDate" class="form-label">Departure Date</label>
                    <input type="date" id="departureDate" name="departureDate" required class="form-control">
                  </div>
                  <div>
                    <label for="returnDate" class="form-label">Return Date</label>
                    <input type="date" id="returnDate" name="returnDate" required class="form-control">
                  </div>
                  <div>
                    <label for="travelMode" class="form-label">Preferred Mode of Travel</label>
                    <select id="travelMode" name="travelMode" required class="form-select">
                      <option value="flight">Flight</option>
                      <option value="train">Train</option>
                      <option value="bus">Bus</option>
                    </select>
                  </div>
                  <div>
                    <label for="travelers" class="form-label">Number of Travelers</label>
                    <input type="number" id="travelers" name="travelers" required class="form-control">
                  </div>
                </div>
              </div>
            </div>
    
            <!-- Accommodation -->
            <div class="accordion-item">
              <h2 class="accordion-header" id="headingAccommodation">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAccommodation" aria-expanded="false" aria-controls="collapseAccommodation">
                  Accommodation
                </button>
              </h2>
              <div id="collapseAccommodation" class="accordion-collapse collapse" aria-labelledby="headingAccommodation" data-bs-parent="#travelBookingAccordion">
                <div class="accordion-body">
                  <div>
                    <label class="form-label">Accommodation Required?</label>
                    <div>
                      <label>
                        <input type="radio" name="accommodation" value="yes" required> Yes
                      </label>
                      <label class="ms-3">
                        <input type="radio" name="accommodation" value="no"> No
                      </label>
                    </div>
                  </div>
                  <div>
                    <label for="roomType" class="form-label">Room Preferences</label>
                    <select id="roomType" name="roomType" class="form-select">
                      <option value="single">Single</option>
                      <option value="double">Double</option>
                      <option value="suite">Suite</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
    
            <!-- Special Requests -->
            <div class="accordion-item">
              <h2 class="accordion-header" id="headingSpecialRequests">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSpecialRequests" aria-expanded="false" aria-controls="collapseSpecialRequests">
                  Special Requests
                </button>
              </h2>
              <div id="collapseSpecialRequests" class="accordion-collapse collapse" aria-labelledby="headingSpecialRequests" data-bs-parent="#travelBookingAccordion">
                <div class="accordion-body">
                  <label for="specialRequests" class="form-label">Special Requests</label>
                  <textarea id="specialRequests" name="specialRequests" rows="4" class="form-control"></textarea>
                </div>
              </div>
            </div>
    
            <!-- Emergency Contact -->
            <div class="accordion-item">
              <h2 class="accordion-header" id="headingEmergencyContact">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseEmergencyContact" aria-expanded="false" aria-controls="collapseEmergencyContact">
                  Emergency Contact
                </button>
              </h2>
              <div id="collapseEmergencyContact" class="accordion-collapse collapse" aria-labelledby="headingEmergencyContact" data-bs-parent="#travelBookingAccordion">
                <div class="accordion-body">
                  <div>
                    <label for="emergencyName" class="form-label">Emergency Contact Name</label>
                    <input type="text" id="emergencyName" name="emergencyName" required class="form-control">
                  </div>
                  <div>
                    <label for="emergencyPhone" class="form-label">Emergency Contact Phone</label>
                    <input type="tel" id="emergencyPhone" name="emergencyPhone" required class="form-control">
                  </div>
                </div>
              </div>
            </div>
    
            <!-- Agreement -->
            <div class="accordion-item">
              <h2 class="accordion-header" id="headingAgreement">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAgreement" aria-expanded="false" aria-controls="collapseAgreement">
                  Agreement
                </button>
              </h2>
              <div id="collapseAgreement" class="accordion-collapse collapse" aria-labelledby="headingAgreement" data-bs-parent="#travelBookingAccordion">
                <div class="accordion-body">
                  <label>
                    <input type="checkbox" name="agreement" required> I agree to the terms and conditions
                  </label>
                </div>
              </div>
            </div>
          </div>
    
          <!-- Submit Button -->
          <div class="text-center mt-4">
            <button type="submit" class="btn btn-success">Submit</button>
          </div>
        </div>
      </form>
      
       <!-- Modal to Display Submitted Data -->
       <div class="modal fade" id="submittedModal" tabindex="-1" aria-labelledby="submittedModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="submittedModalLabel">Booking Submitted Successfully</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p><strong>Full Name:</strong> <span id="modalFullName"></span></p>
              <p><strong>Email:</strong> <span id="modalEmail"></span></p>
              <p><strong>Phone:</strong> <span id="modalPhone"></span></p>
              <p><strong>Date of Birth:</strong> <span id="modalDob"></span></p>
              <p><strong>Destination:</strong> <span id="modalDestination"></span></p>
              <p><strong>Departure Date:</strong> <span id="modalDepartureDate"></span></p>
              <p><strong>Return Date:</strong> <span id="modalReturnDate"></span></p>
              <p><strong>Preferred Mode of Travel:</strong> <span id="modalTravelMode"></span></p>
              <p><strong>Number of Travelers:</strong> <span id="modalTravelers"></span></p>
              <p><strong>Accommodation:</strong> <span id="modalAccommodation"></span></p>
              <p><strong>Room Type:</strong> <span id="modalRoomType"></span></p>
              <p><strong>Special Requests:</strong> <span id="modalSpecialRequests"></span></p>
              <p><strong>Emergency Contact Name:</strong> <span id="modalEmergencyName"></span></p>
              <p><strong>Emergency Contact Phone:</strong> <span id="modalEmergencyPhone"></span></p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        if (params.has('success')) {
          document.getElementById('modalFullName').textContent = params.get('fullName');
          document.getElementById('modalEmail').textContent = params.get('email');
          document.getElementById('modalPhone').textContent = params.get('phone');
          document.getElementById('modalDob').textContent = params.get('dob');
          document.getElementById('modalDestination').textContent = params.get('destination');
          document.getElementById('modalDepartureDate').textContent = params.get('departureDate');
          document.getElementById('modalReturnDate').textContent = params.get('returnDate');
          document.getElementById('modalTravelMode').textContent = params.get('travelMode');
          document.getElementById('modalTravelers').textContent = params.get('travelers');
          document.getElementById('modalAccommodation').textContent = params.get('accommodation');
          document.getElementById('modalRoomType').textContent = params.get('roomType');
          document.getElementById('modalSpecialRequests').textContent = params.get('specialRequests');
          document.getElementById('modalEmergencyName').textContent = params.get('emergencyName');
          document.getElementById('modalEmergencyPhone').textContent = params.get('emergencyPhone');
    
          var myModal = new bootstrap.Modal(document.getElementById('submittedModal'));
          myModal.show();
        }
      };
    </script>
  </body>
</html>
